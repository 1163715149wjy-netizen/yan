name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, codex/plan-28-days]
    paths:
      - ".github/workflows/build-apk.yml"
      - ".source-parts/**"
      - ".patches/**"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Android source
        run: |
          cat .source-parts/source.zip.b64.part-* | base64 --decode > source.zip
          unzip -o source.zip
          cp .patches/v3/App.tsx src/App.tsx
          cp .patches/v3/app.css src/app.css
          cp .patches/v3/build.gradle android/app/build.gradle
          python3 .patches/v4/inject-plan.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install and build web app
        run: |
          npm ci
          npm run android:sync

      - name: Check mobile web UI
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          npm run dev -- --host 127.0.0.1 > /tmp/vite.log 2>&1 &
          node .patches/v4/verify-browser.cjs

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Collect verification tools
        run: |
          mkdir -p verification-tools
          tool_dir=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1 | xargs dirname)
          cp "$tool_dir/lib/apksigner.jar" "$tool_dir/zipalign" verification-tools/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kaoyan-life-unsigned-for-signing
          path: |
            android/app/build/outputs/apk/release/app-release-unsigned.apk
            verification-tools/
            plan-home.png
            plan-last-day.png
          if-no-files-found: error
          retention-days: 30
